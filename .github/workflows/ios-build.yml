name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      CERTIFICATE_P12: ""
      PROVISIONING_PROFILE: ""
      CERT_PASSWORD: "1"
      TEAM_ID: "2TAD594A66"
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      - name: Install deps
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
      - name: Skip SScript
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa
      - name: Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Import cert
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.CERTIFICATE_P12 }}
          p12-password: ${{ env.CERT_PASSWORD }}
      - name: Install provisioning profile
        run: |
          echo "${{ env.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Generate Xcode project
        run: |
          haxelib run lime build Project.xml ios -D officialBuild -D MODS_ALLOWED -D HSCRIPT_ALLOWED -D LUA_ALLOWED --app-version="1.0.4" || true
      - name: Build and sign
        run: |
          cd export/release/ios
          xcodebuild -project PsychEngine.xcodeproj -configuration Release -sdk iphoneos -arch arm64             DEVELOPMENT_TEAM=2TAD594A66             CODE_SIGN_STYLE=Manual             PROVISIONING_PROFILE_SPECIFIER="00008020-000A39E42603802E87"             CODE_SIGN_IDENTITY="Apple Distribution: Terry Peppers (2TAD594A66)"             PRODUCT_BUNDLE_IDENTIFIER=com.cert.account.t260901214911             CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO             build 2>&1 | tail -40
      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PsychEngine.app" -type d 2>/dev/null | head -1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "App: $APP_PATH"
          mkdir Payload && cp -r "$APP_PATH" Payload/
          zip -r PsychEngine-1.0.4.ipa Payload/
          ls -lh PsychEngine-1.0.4.ipa
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-1.0.4-iOS
          path: PsychEngine-1.0.4.ipa
