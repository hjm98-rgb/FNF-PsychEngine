name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Generate Xcode project
        run: |
          haxelib run lime build Project.xml ios \
            -D officialBuild \
            -D MODS_ALLOWED \
            -D HSCRIPT_ALLOWED \
            -D LUA_ALLOWED \
            --app-version="1.0.4" \
            --no-java

      - name: Build with xcodebuild (unsigned)
        run: |
          cd export/release/ios
          xcodebuild -project PsychEngine.xcodeproj \
            -target PsychEngine \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r PsychEngine-1.0.4.ipa Payload/
          ls -lh PsychEngine-1.0.4.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-1.0.4-iOS
          path: PsychEngine-1.0.4.ipa
